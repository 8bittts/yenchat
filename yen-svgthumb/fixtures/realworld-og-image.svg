  </text>

  <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="24" text-anchor="middle" fill="#a3a3a3">
    macOS
  </text>

  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="middle" fill="#737373">
    yen.chat
  </text>

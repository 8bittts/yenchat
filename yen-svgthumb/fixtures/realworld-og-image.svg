<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff5100;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff7a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5100;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <circle cx="100" cy="100" r="80" fill="#ff5100" opacity="0.1"/>
  <circle cx="1100" cy="530" r="100" fill="#ff7a3d" opacity="0.1"/>
  <circle cx="600" cy="315" r="150" fill="#ff5100" opacity="0.05"/>

  <text x="600" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">
    YEN
  </text>

  <text x="600" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="48" text-anchor="middle" fill="#f5f5f0">
    GPU-Accelerated Terminal for macOS
  </text>

  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="32" text-anchor="middle" fill="#d4d4d4">

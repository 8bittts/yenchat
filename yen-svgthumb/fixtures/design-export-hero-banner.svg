<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="50%" stop-color="#ddd6fe" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" />
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#hero)" />
  <circle cx="1320" cy="170" r="120" fill="#ec4899" opacity="0.32" filter="url(#blur)" />
  <circle cx="1220" cy="310" r="160" fill="#7c3aed" opacity="0.24" filter="url(#blur)" />
  <rect x="120" y="120" width="1360" height="660" rx="44" fill="#ffffff" opacity="0.74" />
  <g transform="translate(210,260)" font-family="Helvetica" fill="#0f172a">
    <text x="0" y="0" font-size="58" font-weight="700">Design Export Fixture</text>
    <text x="0" y="78" font-size="30" fill="#334155">Gradient + blur + large rounded container</text>
    <text x="0" y="146" font-size="30" fill="#334155">Representative of Figma-style landing artboard exports.</text>
  </g>
</svg>

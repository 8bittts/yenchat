# YEN File Browser Configuration
# Yazi configuration bundled with YEN.app
#
# This file sets sensible defaults. The "YEN: {cwd}" window title is
# wired up in init.lua via the `ind-app-title` DDS event (Yazi v26.5.6
# removed `title_format`). YAZI_CONFIG_HOME is set when launching from
# Cmd + Shift + O, so this config is used instead of ~/.config/yazi/
# (not merged with it).

[mgr]
# Column width ratio: [parent, current, preview]
# Default is [1, 4, 3] which wastes space in the current dir column.
# [2, 3, 5] gives more room to the preview pane where it matters.
ratio = [2, 3, 5]

# Show hidden files by default (power user expectation)
show_hidden = true

# Natural sort (1, 2, 10 not 1, 10, 2)
sort_by = "natural"

# Directories first, then files
sort_dir_first = true

# Show symlink targets
show_symlink = true

# Lines of padding from cursor to viewport edge
scrolloff = 5

# Keep mouse support simple and avoid motion-event capture side effects.
# AGENTS.md TUI hyperlink mouse rule is Bubble Tea-scoped (Go TUIs), not Yazi.
mouse_events = ["click", "scroll", "touch"]

[preview]
# Wrap preview text to fit the preview pane width
wrap = "yes"

# High quality image previews (macOS has the power)
image_filter = "lanczos3"
image_quality = 90

# Retina-appropriate preview dimensions (2x for HiDPI)
max_width = 2000
max_height = 2000

[opener]
# Read-only file viewer for Enter/open on text-like files: the system pager,
# so a stray keypress cannot edit the file. `-+F` keeps a short file on screen
# even when the user's LESS sets quit-if-one-screen; the preview pane carries
# the syntax colors.
view = [{ run = "less -R -+F -- %s", block = true, desc = "View (less)", for = "unix" }]

# Explicit editor opener used by bulk create/rename flows and open-with.
# Wrapper keeps EDITOR behavior but can enforce compatibility flags per editor.
edit = [{ run = "yen-yazi-edit %s", block = true, desc = "$EDITOR", for = "unix" }]

# Route archive extraction through native bsdtar-based plugin.
extract = [{ run = "ya pub extract-native --list %s", desc = "Extract here (native)" }]

[open]
# Keep default open behavior for non-text files, but make text opens
# read-only by default while preserving edit/reveal choices.
prepend_rules = [
    # Yazi internal temp files used by bulk create/rename must open in editor.
    { url = "bulk-create.txt", use = "edit" },
    { url = "bulk-rename.txt", use = "edit" },
    { mime = "text/*", use = [ "view", "edit", "reveal" ] },
    { mime = "application/{json,ndjson,x-ndjson,javascript,xml,toml,yaml,x-yaml}", use = [ "view", "edit", "reveal" ] },
    { url = "*.ndjson", use = [ "view", "edit", "reveal" ] },
]

[plugin]
# Use native macOS video thumbnailer (yen-vidthumb) instead of ffmpeg-based preview rendering.
# prepend_ takes priority over built-in rules.
prepend_previewers = [
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive-native" },
    { mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive-native" },
    { url = "*.{AppImage,appimage}", run = "archive-native" },
    { mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive-native" },
    { mime = "application/virtualbox-{vhd,vhdx}", run = "archive-native" },
    { url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive-native" },
    { mime = "text/*", run = "code-guard" },
    { mime = "application/{json,ndjson,x-ndjson,javascript,xml,toml,yaml,x-yaml}", run = "code-guard" },
    { url = "*.ndjson", run = "code-guard" },
    { mime = "video/*", run = "video-native" },
    { mime = "application/pdf", run = "pdf-native" },
    { mime = "image/svg+xml", run = "svg-native" },
    { url = "*.svg", run = "svg-native" },
    { url = "*.svgz", run = "svg-native" },
]
prepend_preloaders = [
    { mime = "video/*", run = "video-native" },
    { mime = "application/pdf", run = "pdf-native" },
    { mime = "image/svg+xml", run = "svg-native" },
    { url = "*.svg", run = "svg-native" },
    { url = "*.svgz", run = "svg-native" },
]

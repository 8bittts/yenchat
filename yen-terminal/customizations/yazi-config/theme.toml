# YEN File Browser Theme
# Static bundled theme used by the file browser launcher.

[flavor]
dark = "catppuccin-mocha"
light = "catppuccin-latte"

[mgr]
cwd = { fg = "#ff5100" }
find_keyword = { fg = "#e5c07b", bold = true }
find_position = { fg = "#c678dd", italic = true }
marker_selected = { fg = "#262b36", bg = "#ff5100" }
marker_copied = { fg = "#262b36", bg = "#98c379" }
marker_cut = { fg = "#262b36", bg = "#e06c75" }
border_symbol = "│"
border_style = { fg = "#5c6370" }
count_copied = { fg = "#262b36", bg = "#98c379" }
count_cut = { fg = "#262b36", bg = "#e06c75" }
count_selected = { fg = "#262b36", bg = "#ff5100" }

[tabs]
active = { fg = "#262b36", bg = "#ff5100" }
inactive = { fg = "#c8cdd5", bg = "#3e4451" }

[indicator]
current = { reversed = true }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#61afef" }
perm_read = { fg = "#e5c07b" }
perm_write = { fg = "#e06c75" }
perm_exec = { fg = "#98c379" }
perm_sep = { fg = "#5c6370" }

[input]
border = { fg = "#ff5100" }
title = { fg = "#ff5100" }
value = { fg = "#ffffff" }
selected = { reversed = true }

[cmp]
border = { fg = "#5c6370" }
active = { fg = "#262b36", bg = "#ff5100" }
inactive = { fg = "#abb2bf" }

[tasks]
border = { fg = "#5c6370" }
title = { fg = "#ff5100" }
hovered = { fg = "#c678dd", underline = true }

[spot]
border = { fg = "#5c6370" }
title = { fg = "#ff5100" }

[pick]
border = { fg = "#5c6370" }
active = { fg = "#262b36", bg = "#ff5100" }
inactive = { fg = "#abb2bf" }

[confirm]
border = { fg = "#5c6370" }
title = { fg = "#ff5100" }

[which]
mask = { bg = "#262b36" }
cand = { fg = "#56b6c2" }
rest = { fg = "#5c6370" }
desc = { fg = "#c678dd" }
separator = " → "
separator_style = { fg = "#5c6370" }

[help]
on = { fg = "#56b6c2" }
run = { fg = "#c678dd" }
desc = { fg = "#abb2bf" }
hovered = { reversed = true }
footer = { fg = "#5c6370", italic = true }

[notify]
title_info = { fg = "#98c379" }
title_warn = { fg = "#e5c07b" }
title_error = { fg = "#e06c75" }

[git]
ignored = { fg = "#5c6370" }
untracked = { fg = "#c678dd" }
modified = { fg = "#e5c07b" }
added = { fg = "#98c379" }
deleted = { fg = "#e06c75" }
updated = { fg = "#e5c07b" }

[filetype]
# Yazi v25.12.29+ requires every rule to specify `url` or `mime`. Pure
# `is = "link"`/`"orphan"`/`"exec"` rules now need a wildcard `url = "*"`
# selector; the `is` predicate continues to act as the actual filter.
rules = [
    { url = "*/", fg = "#61afef", bold = true },
    { url = "*", is = "link", fg = "#56b6c2" },
    { url = "*", is = "orphan", fg = "#e06c75" },
    { url = "*", is = "exec", fg = "#98c379" },
    { url = ".*", fg = "#5c6370" },
    { mime = "image/*", fg = "#e5c07b" },
    { mime = "video/*", fg = "#c678dd" },
    { mime = "audio/*", fg = "#c678dd" },
    { mime = "application/zip", fg = "#e06c75" },
    { mime = "application/gzip", fg = "#e06c75" },
    { mime = "application/x-tar", fg = "#e06c75" },
    { mime = "application/x-bzip2", fg = "#e06c75" },
    { mime = "application/x-7z-compressed", fg = "#e06c75" },
    { mime = "application/x-rar", fg = "#e06c75" },
    { mime = "application/x-xz", fg = "#e06c75" },
    { mime = "application/pdf", fg = "#56b6c2" },
    { mime = "application/msword", fg = "#56b6c2" },
    { mime = "application/vnd.*", fg = "#56b6c2" },
    { mime = "text/*", fg = "#98c379" },
    { mime = "application/json", fg = "#98c379" },
    { mime = "application/javascript", fg = "#98c379" },
    { mime = "application/xml", fg = "#98c379" },
    { mime = "application/toml", fg = "#98c379" },
    { mime = "application/yaml", fg = "#98c379" },
]

[icon]
prepend_globs = []
append_globs = []

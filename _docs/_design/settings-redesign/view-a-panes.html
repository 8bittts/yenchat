<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>YEN Settings · View A · Panes</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* View A: the HIG settings window. A noncustomizable toolbar of panes floats
     in Liquid Glass; the window title names the visible pane. */
  .view-a { width: 820px; height: 700px; }

  .view-a .toolbar {
    position: absolute;
    inset: 0 0 auto 0;
    height: 86px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 18px;
    z-index: 5;
    pointer-events: none;
  }
  .view-a .toolbar > * { pointer-events: auto; }
  .view-a .lead { display: flex; align-items: center; gap: 14px; }

  .view-a .tabs {
    display: flex;
    gap: 2px;
    padding: 5px;
    border-radius: 22px;
  }
  .view-a .tabs button {
    border: 0;
    background: transparent;
    width: 86px;
    padding: 7px 4px 6px;
    border-radius: 17px;
    display: grid;
    justify-items: center;
    gap: 3px;
    font-size: 11px;
    color: var(--label-2);
    cursor: pointer;
  }
  .view-a .tabs button .icon { width: 22px; height: 22px; }
  .view-a .tabs button:hover { background: var(--fill); }
  .view-a .tabs button[aria-current="page"] {
    background: var(--fill-2);
    color: var(--accent);
    font-weight: 600;
  }

  /* Scroll edge effect: content fades as it passes under the toolbar. */
  .view-a .content {
    height: 100%;
    overflow-y: auto;
    padding: 108px 44px 30px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 26px, #000 104px);
    mask-image: linear-gradient(to bottom, transparent 26px, #000 104px);
  }

  .view-a .hero-term { height: 148px; }
  .view-a .themes-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px 4px; }
  .view-a .themes-head .group-title { margin: 0; }
  .view-a .themes.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px 12px; }
</style>
</head>
<body>

<div class="review-bar glass">
  <span>YEN Settings redesign</span>
  <span class="sep"></span>
  <a href="index.html">Overview</a>
  <a href="view-a-panes.html" aria-current="page">A · Panes</a>
  <a href="view-b-sidebar.html">B · Sidebar</a>
  <a href="view-c-studio.html">C · Studio</a>
  <span class="sep"></span>
  <span class="segmented">
    <button type="button" data-appearance-set="auto" aria-pressed="true">Auto</button>
    <button type="button" data-appearance-set="light" aria-pressed="false">Light</button>
    <button type="button" data-appearance-set="dark" aria-pressed="false">Dark</button>
  </span>
</div>

<main class="window view-a" data-settings aria-label="YEN Settings">
  <header class="toolbar">
    <div class="lead">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <span class="pane-title" data-title></span>
    </div>
    <nav class="tabs glass" data-nav aria-label="Settings panes"></nav>
    <span></span>
  </header>
  <div class="content" data-scroll>
    <div data-panes></div>
  </div>
</main>

<script src="shared.js"></script>
<script>
  YENSettings.mount({ themeLayout: "grid", previewLines: 4 });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>YEN Settings · View C · Studio</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* View C: the window is a live terminal. Every setting changes it in place,
     and the controls float above it in Liquid Glass: an inspector and a theme
     dock. Glass sits on the control layer; the terminal is the content layer. */
  .view-c { width: 1100px; height: 690px; background: transparent; }

  .view-c .stage { position: absolute; inset: 0; border-radius: 26px; }
  .view-c .stage .term-body { padding: calc(var(--t-pad) + 56px) calc(var(--t-pad) + 376px) 0 calc(var(--t-pad) + 22px); }
  .view-c .traffic { position: absolute; top: 20px; left: 20px; z-index: 3; }
  .view-c .stage-caption {
    position: absolute;
    top: 14px;
    left: 86px;
    z-index: 3;
    font-size: 12px;
    padding: 4px 11px;
    border-radius: 999px;
    color: var(--label-2);
  }

  /* The regular glass variant: enough tint to keep a text-heavy panel legible
     over any theme, light or dark. */
  .view-c .inspector,
  .view-c .dock {
    background: color-mix(in srgb, var(--window-bg) 96%, transparent);
    -webkit-backdrop-filter: blur(36px) saturate(180%);
    backdrop-filter: blur(36px) saturate(180%);
  }

  .view-c .inspector {
    position: absolute;
    top: 12px;
    right: 12px;
    bottom: 12px;
    width: 348px;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    z-index: 4;
    overflow: hidden;
  }
  .view-c .inspector-head { padding: 12px 14px 8px; display: grid; gap: 12px; justify-items: center; }
  .view-c .icon-tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill); }
  .view-c .icon-tabs button {
    border: 0;
    background: transparent;
    width: 52px;
    height: 32px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    color: var(--label-2);
    cursor: pointer;
  }
  .view-c .icon-tabs button span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .view-c .icon-tabs button[aria-current="page"] {
    background: var(--control-bg);
    color: var(--accent);
    box-shadow: 0 1px 2.5px rgba(0, 0, 0, 0.16), inset 0 0.5px 0 rgba(255, 255, 255, 0.6);
  }
  .view-c .inspector-title { font-size: 15px; font-weight: 600; margin: 0; justify-self: start; padding-left: 4px; }
  .view-c .inspector-scroll { flex: 1; overflow-y: auto; padding: 6px 14px 16px; }

  .view-c .group { margin-bottom: 18px; }
  .view-c .row { min-height: 42px; padding: 6px 12px; gap: 10px; }
  .view-c .row + .row::before { left: 12px; right: 12px; }
  .view-c .row.is-child { padding-left: 26px; }
  .view-c .slider { width: 118px; }
  .view-c .popup { max-width: 172px; }
  .view-c .row-value { min-width: 38px; }
  .view-c .keys button { min-width: 92px; }
  .view-c .shortcut-cats .segmented button { padding-inline: 9px; }

  .view-c .dock {
    position: absolute;
    left: 12px;
    right: 372px;
    bottom: 12px;
    border-radius: 22px;
    padding: 12px 14px 14px;
    z-index: 4;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .view-c:not([data-active-pane="appearance"]) .dock { opacity: 0; transform: translateY(10px); pointer-events: none; }
  .view-c .dock-head { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 10px; }
  .view-c .dock-head strong { font-size: 13px; }
  .view-c .dock-head span { font-size: 12px; color: var(--label-2); }
  .view-c .dock-themes { display: grid; grid-template-columns: repeat(10, 1fr); gap: 9px; }
  .view-c .dock-themes .theme-name,
  .view-c .dock-themes .theme-swatch b { display: none; }
  .view-c .dock-themes .theme-swatch { border-radius: 10px; padding: 0; aspect-ratio: 16 / 11; }
  .view-c .dock-themes .theme-swatch .dots { left: 7px; bottom: 6px; gap: 3px; }
  .view-c .dock-themes .theme-swatch .dots i { width: 5px; height: 5px; }
</style>
</head>
<body>

<div class="review-bar glass">
  <span>YEN Settings redesign</span>
  <span class="sep"></span>
  <a href="index.html">Overview</a>
  <a href="view-a-panes.html">A · Panes</a>
  <a href="view-b-sidebar.html">B · Sidebar</a>
  <a href="view-c-studio.html" aria-current="page">C · Studio</a>
  <span class="sep"></span>
  <span class="segmented">
    <button type="button" data-appearance-set="auto" aria-pressed="true">Auto</button>
    <button type="button" data-appearance-set="light" aria-pressed="false">Light</button>
    <button type="button" data-appearance-set="dark" aria-pressed="false">Dark</button>
  </span>
</div>

<main class="window view-c" data-settings aria-label="YEN Settings">
  <div class="stage term" data-term data-lines="8" aria-label="Live terminal preview"></div>
  <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
  <span class="stage-caption glass">Live preview</span>

  <section class="dock glass" aria-label="Themes">
    <div class="dock-head"><strong data-theme-name></strong><span data-theme-tone></span><span>· 20 themes</span></div>
    <div class="dock-themes" data-external-themes></div>
  </section>

  <aside class="inspector glass">
    <div class="inspector-head">
      <nav class="icon-tabs" data-nav aria-label="Settings panes"></nav>
      <h1 class="inspector-title" data-title></h1>
    </div>
    <div class="inspector-scroll" data-scroll>
      <div data-panes></div>
    </div>
  </aside>
</main>

<script src="shared.js"></script>
<script>
  YENSettings.mount({
    inlinePreview: false,
    inlineThemes: false,
    navItem: (pane, icon) => `<button type="button" data-go="${pane.id}" title="${pane.title}">${icon(pane.id)}<span>${pane.title}</span></button>`,
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>YEN Settings · View B · Sidebar</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* View B: the System Settings idiom. A Liquid Glass sidebar floats over the
     window; the content column is a single calm measure with a large title. */
  .view-b { width: 920px; height: 680px; display: flex; }

  .view-b .sidebar {
    width: 226px;
    margin: 8px;
    border-radius: 20px;
    padding: 16px 10px 12px;
    display: flex;
    flex-direction: column;
    flex: none;
  }
  .view-b .traffic { padding: 2px 8px 18px; }
  .view-b .nav { display: grid; gap: 2px; }
  .view-b .nav button {
    border: 0;
    background: transparent;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
  }
  .view-b .nav button:hover { background: var(--fill); }
  .view-b .nav button[aria-current="page"] { background: var(--fill-2); font-weight: 600; }
  .view-b .sidebar-foot { margin-top: auto; padding: 10px 10px 2px; font-size: 11px; color: var(--label-3); }

  .view-b .content { flex: 1; min-width: 0; overflow-y: auto; padding: 0 34px 34px; }
  .view-b .column { max-width: 600px; margin: 0 auto; }
  .view-b .big-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    padding: 30px 4px 20px;
  }

  .view-b .hero-term { height: 196px; border-radius: 18px; }
  .view-b .themes-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px 4px; }
  .view-b .themes-head .group-title { margin: 0; }
  .view-b .themes-count { font-size: 12px; color: var(--label-3); }
  .view-b .themes.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 14px; }
  .view-b .theme-swatch { border-radius: 14px; font-size: 10px; padding: 11px 12px; }
</style>
</head>
<body>

<div class="review-bar glass">
  <span>YEN Settings redesign</span>
  <span class="sep"></span>
  <a href="index.html">Overview</a>
  <a href="view-a-panes.html">A · Panes</a>
  <a href="view-b-sidebar.html" aria-current="page">B · Sidebar</a>
  <a href="view-c-studio.html">C · Studio</a>
  <span class="sep"></span>
  <span class="segmented">
    <button type="button" data-appearance-set="auto" aria-pressed="true">Auto</button>
    <button type="button" data-appearance-set="light" aria-pressed="false">Light</button>
    <button type="button" data-appearance-set="dark" aria-pressed="false">Dark</button>
  </span>
</div>

<main class="window view-b" data-settings aria-label="YEN Settings">
  <aside class="sidebar glass">
    <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
    <nav class="nav" data-nav aria-label="Settings panes"></nav>
    <div class="sidebar-foot">YEN 1.263</div>
  </aside>
  <div class="content" data-scroll>
    <div class="column">
      <h1 class="big-title" data-title></h1>
      <div data-panes></div>
    </div>
  </div>
</main>

<script src="shared.js"></script>
<script>
  YENSettings.mount({
    themeLayout: "sections",
    previewLines: 6,
    navItem: (pane, icon) =>
      `<button type="button" data-go="${pane.id}"><span class="row-lead" style="background:${pane.tint}">${icon(pane.id)}</span><span>${pane.title}</span></button>`,
  });
</script>
</body>
</html>
